<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6bff"/>
      <stop offset="55%" stop-color="#5b3df0"/>
      <stop offset="100%" stop-color="#3a1fb8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#ffc94d"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cffb0"/>
      <stop offset="100%" stop-color="#22c98e"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a0f5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>

  <!-- Ground shadow under building -->
  <ellipse cx="256" cy="398" rx="150" ry="14" fill="#1a0f5c" opacity="0.25"/>

  <!-- Main building block -->
  <rect x="126" y="230" width="260" height="168" rx="10" fill="#ffffff"/>

  <!-- Roof / pediment (triangle) -->
  <path d="M 106 232 L 256 118 L 406 232 Z" fill="url(#roofGrad)"/>
  <rect x="112" y="222" width="288" height="20" rx="8" fill="#ffe9a8"/>

  <!-- Bell tower with flag -->
  <rect x="238" y="70" width="36" height="58" rx="4" fill="#ffffff"/>
  <path d="M 256 70 L 256 34" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 36 L 290 46 L 256 56 Z" fill="#5cffb0"/>

  <!-- Columns -->
  <rect x="152" y="252" width="18" height="146" rx="4" fill="#c9b8ff"/>
  <rect x="200" y="252" width="18" height="146" rx="4" fill="#c9b8ff"/>
  <rect x="294" y="252" width="18" height="146" rx="4" fill="#c9b8ff"/>
  <rect x="342" y="252" width="18" height="146" rx="4" fill="#c9b8ff"/>

  <!-- Door -->
  <rect x="232" y="330" width="48" height="68" rx="8" fill="#5b3df0"/>
  <circle cx="266" cy="366" r="3.5" fill="#ffe9a8"/>

  <!-- Windows -->
  <rect x="160" y="266" width="0" height="0"/>
  <g fill="#5b3df0">
    <rect x="176" y="264" width="16" height="18" rx="3"/>
    <rect x="224" y="264" width="16" height="18" rx="3"/>
    <rect x="272" y="264" width="16" height="18" rx="3"/>
    <rect x="320" y="264" width="16" height="18" rx="3"/>
  </g>

  <!-- Base step -->
  <rect x="112" y="392" width="288" height="16" rx="6" fill="#e9e2ff"/>

  <!-- Checkmark badge -->
  <circle cx="378" cy="378" r="66" fill="#0e0b2e"/>
  <circle cx="378" cy="378" r="58" fill="url(#checkGrad)"/>
  <path d="M 352 378 L 371 397 L 407 356" stroke="#0e0b2e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
